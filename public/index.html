<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Mind Tracker</title>
<style>
:root{--navy:#1d2c46;--green:#217344;--greenbg:#e1f4e7;--amber:#a36508;--amberbg:#fff2d8;--red:#b83232;--redbg:#fce7e7;--line:#e3e7ed;--muted:#687386}*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#202b3c;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 36px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #1d2c4608}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted);font-size:13px}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 5px}h3{font-size:16px;margin:0}button,input{font:inherit}button{padding:10px 13px;border:1px solid #d7dce5;border-radius:10px;background:#fff;color:inherit;font-weight:650;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #9db7e8}.primary{background:var(--navy);border-color:var(--navy);color:#fff}.tabs{display:flex;gap:8px;margin:16px 0}.tab.active{background:#e5edfb;border-color:#c8d7f3;color:var(--navy)}input[type=date],input[type=text],input[type=password]{min-width:0;padding:10px;border:1px solid #d7dce5;border-radius:10px;background:white;width:100%}.hour{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #eff1f4}.hour:last-child{border:0}.state-chip{width:100%;padding:9px 4px;font-size:13px}.goal{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eff1f4}.goal:last-child{border:0}.goal input{width:19px;height:19px}.rating-group{margin-top:18px}.rating-scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}.rating-btn{padding:12px 4px;font-weight:750}.rating-btn.selected{background:var(--navy);border-color:var(--navy);color:#fff}.rating-caption{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:5px}.hidden{display:none!important}.login{max-width:500px;margin:7vh auto;padding:28px 20px}.login label{display:block;margin-top:10px}.login input{display:block;width:100%;margin:6px 0 12px;padding:14px}.login button{display:block;width:100%;margin:10px 0;padding:14px}.login .muted{line-height:1.5}.setting{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eff1f4}.setting input[type=text]{flex:1}.setting input[type=checkbox]{width:20px;height:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.error{color:var(--red);font-size:13px}.success{color:var(--green);font-size:13px}.chart-wrap{width:100%;overflow:hidden}.chart-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.chart-note{font-size:12px;color:var(--muted);margin-top:4px}@media(max-width:430px){main{padding:12px}.state-option{padding:12px 4px}.hour{grid-template-columns:67px 1fr;gap:6px}.state-chip{font-size:12px}}
</style></head><body><main id="app"></main><script>
const app=document.getElementById('app'), HOURS=Array.from({length:19},(_,i)=>i+4), LABEL=h=>`${h%12||12}:00 ${h<12?'AM':'PM'}`;
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let token=localStorage.getItem('mindToken')||'',currentUser={username:'',role:'user'},date=todayISO(),dayData=null,selectedHour=22,selectedState='3',selectedAttention={thought_attention:0,time_attention:0},selectedHours=new Set(),bulkCheckin=false;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(options.headers||{})}});if(response.status===401&&url!='/api/login'){token='';localStorage.removeItem('mindToken');login();throw new Error('Please sign in again.')}return response}
function login(){app.innerHTML=`<section class="login card"><div style="text-align:center;padding:12px 0 18px"><div style="font-size:38px">☀</div><h1>Daily Mind Tracker</h1><p class="muted">Observe your mind · Transform your state</p></div><label>Username<input id="loginUser" autocomplete="username" placeholder="Username"></label><label>Password<input id="loginPass" type="password" autocomplete="current-password" placeholder="Password"></label><button id="loginBtn" class="primary" style="width:100%">Sign In</button><button id="registerBtn" style="width:100%">Create Account</button><p class="muted">Create your own account. Username must be 3–30 characters; password must be at least 12 characters.</p><p id="loginError" class="error" role="status"></p></section>`;document.getElementById('loginBtn').onclick=doLogin;document.getElementById('registerBtn').onclick=doRegister;document.getElementById('loginPass').onkeydown=e=>{if(e.key==='Enter')doLogin()}}
async function doRegister(){const error=document.getElementById('loginError'),username=document.getElementById('loginUser').value,password=document.getElementById('loginPass').value;error.textContent='';if(!username.trim()||!password){error.textContent='Enter a username and password to create an account.';return}const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const data=await r.json();if(!r.ok){error.textContent=data.error||'Could not create account.';return}token=data.token;currentUser={username:data.username,role:'user'};localStorage.setItem('mindToken',token);renderToday()}
async function doLogin(){const error=document.getElementById('loginError');const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('loginUser').value,password:document.getElementById('loginPass').value})});if(!r.ok){error.textContent='Invalid username or password';return}const result=await r.json();token=result.token;currentUser={username:result.username,role:result.role};localStorage.setItem('mindToken',token);renderToday()}
function renderTodayShell(){app.innerHTML=`<header id="appHeader" class="top"><div><h1>Daily Mind Tracker</h1><div class="muted">Be Aware · Track Your Mind · Live Better</div></div><input id="datePicker" type="date" value="${date}" style="max-width:165px"></header><nav id="appNav" class="tabs"><button class="tab active" id="todayTab">Today</button><button class="tab" id="settingsTab">⚙ Settings</button></nav><section id="todayPage"><div class="card"><div class="top"><div><h2>Hourly Mind Check</h2><div class="muted">Tap an hour to record your Mental State rating</div></div><span>◉</span></div><div id="hourRows" style="margin-top:12px"></div></div><div class="card"><div class="top"><div><h2>Daily Goals</h2><div class="muted">Your active goals from Settings</div></div><strong id="goalCount">0 of 0</strong></div><div id="dailyGoals"></div></div><div class="card"><h2>Mental State Rating</h2><p class="muted">Check-ins for the selected date</p><div id="stateChart" class="chart-wrap"></div><p class="chart-note">Mental State · 1 (Very low) to 5 (Excellent)</p></div><div class="card"><h2>Attention Trend</h2><p class="muted">Scores by hour · 1 to 5</p><div id="attentionChart" class="chart-wrap"></div><div class="chart-legend"><span><i class="legend-dot" style="background:#365fbd"></i>Attention on thought</span><span><i class="legend-dot" style="background:#8a55b5"></i>Attention on Time</span></div><p class="chart-note">Only saved ratings are plotted.</p></div></section><section id="checkinPage" class="hidden"></section><section id="settingsPage" class="hidden"></section><p id="notice" class="muted" role="status"></p>`;document.getElementById('datePicker').onchange=e=>{date=e.target.value;renderToday()};document.getElementById('todayTab').onclick=renderToday;document.getElementById('settingsTab').onclick=renderSettings}
async function renderToday(){if(!document.getElementById('todayPage'))renderTodayShell();showPage('todayPage','todayTab');const r=await api('/api/day/'+date);if(!r.ok)return;dayData=await r.json();const rows=document.getElementById('hourRows');rows.innerHTML='';HOURS.forEach(hour=>{const check=dayData.checkins.find(c=>Number(c.hour)===Number(hour));const row=document.createElement('div');row.className='hour';row.innerHTML=`<strong>${LABEL(hour)}</strong><button class="state-chip ${check?check.mind_state.toLowerCase():''}" style="text-align:left" aria-label="Check in at ${LABEL(hour)}">${check?`${check.mind_state}${check.thought_attention?` · Thought ${check.thought_attention}/5`:''}${check.time_attention?` · Time ${check.time_attention}/5`:''}`: '＋ Check in'}</button>`;row.querySelector('button').onclick=()=>openCheckin(hour,check ? String(check.mind_state) : '3');rows.append(row)});const goals=document.getElementById('dailyGoals');goals.innerHTML='';const done=dayData.goals.filter(g=>g.completed).length;document.getElementById('goalCount').textContent=`${done} of ${dayData.goals.length}`;dayData.goals.forEach(g=>{const label=document.createElement('label');label.className='goal';label.innerHTML=`<input type="checkbox" ${g.completed?'checked':''}><span>${escapeHTML(g.goal_name)}</span>`;label.querySelector('input').onchange=async e=>{await api(`/api/day/${date}/goal/${g.id}`,{method:'PUT',body:JSON.stringify({completed:e.target.checked})});renderToday()};goals.append(label)});renderCharts(dayData.checkins)}
function renderCharts(checkins){
  
  const stateBox=document.getElementById('stateChart');
  if(stateBox){
    if(!checkins.length){
      stateBox.innerHTML='<p class="chart-note">No check-ins recorded for this date yet.</p>';
    }else{
      const width=390,height=164,plot={left:44,right:12,top:16,bottom:32};
      const plotW=width-plot.left-plot.right,plotH=height-plot.top-plot.bottom;
      const yForValue=v=>plot.top+(5-Number(v))/4*plotH;
      const xFor=hour=>plot.left+(hour-4)/18*plotW;
      const guides=[1,2,3,4,5].map(v=>`<line x1="${plot.left}" y1="${yForValue(v)}" x2="${width-plot.right}" y2="${yForValue(v)}" stroke="#e7eaf0" stroke-dasharray="3 3"/><text x="${plot.left-8}" y="${yForValue(v)+4}" text-anchor="end" font-size="11" fill="#687386">${v}</text>`).join('');
      const ticks=Array.from({length:19},(_,i)=>{
        const hour=i+4;
        return `<line x1="${xFor(hour)}" y1="${plot.top+plotH}" x2="${xFor(hour)}" y2="${plot.top+plotH+4}" stroke="#9aa4b2"/><text x="${xFor(hour)}" y="${height-8}" text-anchor="middle" font-size="8" fill="#687386">${hour%12||12}${hour<12?' AM':' PM'}</text>`;
      }).join('');
      const points=checkins.slice().sort((a,b)=>a.hour-b.hour).map(c=>({x:xFor(c.hour),y:yForValue(Number(c.mind_state)),c}));
      const connected=points.map(p=>`${p.x},${p.y}`).join(' ');
      const dots=points.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#365fbd" stroke="#fff" stroke-width="1.5"><title>${p.c.hour%12||12}:00 ${p.c.hour<12?'AM':'PM'} — Mental State ${p.c.mind_state}/5</title></circle>`).join('');
      stateBox.innerHTML=`<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block" role="img" aria-label="Mental State rating from 1 to 5 by hour. X axis shows hours from 4 AM to 10 PM.">${guides}<line x1="${plot.left}" y1="${plot.top+plotH}" x2="${width-plot.right}" y2="${plot.top+plotH}" stroke="#9aa4b2"/>${ticks}<polyline points="${connected}" fill="none" stroke="#53657e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg><p class="chart-note">Each dot shows the saved state for that hour; lines connect recorded check-ins in time order.</p>`;
    }
  }
  const attentionBox=document.getElementById('attentionChart');
  if(attentionBox){
    const rated=checkins.filter(c=>c.thought_attention>0&&c.time_attention>0).sort((a,b)=>a.hour-b.hour);
    if(!rated.length){attentionBox.innerHTML='<p class="chart-note">Save both attention ratings to see your trend.';return;}
    const px=i=>30+i*(340/Math.max(1,rated.length-1)),py=v=>105-(v-1)*21;
    let grid='';
    for(let v=1;v<=5;v++){grid+=`<line x1="26" y1="${py(v)}" x2="374" y2="${py(v)}" stroke="#e7eaf0"/><text x="15" y="${py(v)+4}" font-size="10" fill="#687386">${v}</text>`;}
    // Offset overlapping series by a few pixels so both ratings remain visible when they have the same score.
    const line=(field,color,offset)=>{const pts=rated.map((c,i)=>`${px(i)},${py(c[field])+offset}`).join(' ');return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`+rated.map((c,i)=>`<circle cx="${px(i)}" cy="${py(c[field])+offset}" r="3.5" fill="${color}" stroke="#fff" stroke-width="0.8"><title>${LABEL(c.hour)}: ${c[field]}/5</title></circle>`).join('');};
    attentionBox.innerHTML=`<svg viewBox="0 0 390 130" style="width:100%;height:auto;display:block" role="img" aria-label="Attention ratings by hour. Blue shows attention on thought; purple shows attention on time.">${grid}${line('time_attention','#8a55b5',-2)}${line('thought_attention','#365fbd',2)}${rated.map((c,i)=>i===0||i===rated.length-1||i%Math.ceil(rated.length/5)===0?`<text x="${px(i)}" y="124" text-anchor="middle" font-size="9" fill="#687386">${c.hour%12||12}${c.hour<12?'a':'p'}</text>`:'').join('')}</svg>`;
  }
}
function showPage(page,tab){['todayPage','checkinPage','settingsPage'].forEach(id=>document.getElementById(id)?.classList.toggle('hidden',id!==page));['todayTab','settingsTab'].forEach(id=>document.getElementById(id)?.classList.toggle('active',id===tab));document.getElementById('appHeader')?.classList.toggle('hidden',page==='checkinPage');document.getElementById('appNav')?.classList.toggle('hidden',page==='checkinPage')}
function openCheckin(hour,state){
 selectedHour=hour;selectedState=(Number.isInteger(Number(state))&&Number(state)>=1&&Number(state)<=5?String(state):'3');
 const saved=dayData?.checkins.find(c=>c.hour===hour);
 selectedAttention={thought_attention:saved?.thought_attention||0,time_attention:saved?.time_attention||0};
 bulkCheckin=!saved;
 selectedHours=new Set();
 if(bulkCheckin){
   const checkins=dayData?.checkins||[];
   const lastCheckedBefore=checkins.filter(c=>Number(c.hour)<selectedHour).reduce((max,c)=>Math.max(max,c.hour),0);
   HOURS.forEach(h=>{
     const existing=checkins.some(c=>Number(c.hour)===Number(h));
     if(!existing && h>lastCheckedBefore && h<=selectedHour) selectedHours.add(h);
   });
 }
 showPage('checkinPage','todayTab');drawCheckin();
}
function drawCheckin(){
 const page=document.getElementById('checkinPage');
 const checkins=dayData?.checkins||[];
 const dateParts=date.split('-');
 const dateLabel=`${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;
 const existingAtHour=h=>checkins.some(c=>Number(c.hour)===Number(h));
 const lastCheckedBefore=checkins.filter(c=>Number(c.hour)<selectedHour).reduce((max,c)=>Math.max(max,c.hour),0);
 const eligibleDefaultHours=HOURS.filter(h=>!existingAtHour(h)&&h>lastCheckedBefore&&h<=selectedHour);
 const hourSelection=bulkCheckin?`<div class="card"><h2>Select Hours to Check In</h2><p class="muted">Already checked hours are locked. You can select any unfilled hour.</p><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:12px">${HOURS.filter(h=>h<=selectedHour).map(h=>{
   const existing=existingAtHour(h),selected=selectedHours.has(h),defaultEligible=eligibleDefaultHours.includes(h);
   const style=existing?'background:var(--greenbg);border-color:#bfe5cb;color:var(--green);cursor:not-allowed;':selected?'background:#e8f1ff;border:2px solid #8ab8ff;color:#174ea6;':'background:#fff;color:var(--muted);';
   return `<button type="button" data-hour-toggle="${h}" ${existing?'disabled':''} aria-pressed="${selected}" style="padding:9px 3px;min-height:70px;font-size:12px;${style}">${existing?'✓':selected?'☑':'□'}<br>${LABEL(h).replace(':00 ','<br>')}</button>`;
 }).join('')}</div><div class="chart-legend" style="margin-top:12px"><span><i class="legend-dot" style="background:#159957"></i>Already checked in (locked)</span><span><i class="legend-dot" style="background:#1677ff"></i>Selected (will be saved)</span><span>□ Unfilled (can be selected)</span></div><p class="muted">Unfilled hours from ${lastCheckedBefore?LABEL(lastCheckedBefore)+' + 1': '4:00 AM'} through ${LABEL(selectedHour)} are selected by default. Other unfilled hours remain available.</p></div>`:'';
 page.innerHTML=`<div class="card"><div class="top" style="justify-content:flex-start;gap:12px"><button id="backToday">‹ Back to Today</button><div><h1>Check-In</h1><div class="muted">${escapeHTML(dateLabel)}${date===todayISO()?' (Today)':''}</div><div class="muted">${LABEL(selectedHour)} Check-In</div></div></div>${hourSelection}<div style="text-align:center;padding:16px 0"><h1>${LABEL(selectedHour)} Check-in</h1><p class="muted">Observe your state, then rate your attention.</p></div><div class="rating-group"><h2>Mental State (1 to 5)</h2><div class="rating-scale">${[1,2,3,4,5].map(n=>`<button class="rating-btn ${String(selectedState)===String(n)?'selected':''}" data-state="${n}" aria-pressed="${String(selectedState)===String(n)}">${n}</button>`).join('')}</div><div class="rating-caption"><span>1 · Very low</span><span>5 · Excellent</span></div></div><div class="rating-group"><h2>Attention on thought</h2><div class="rating-scale">${[1,2,3,4,5].map(n=>`<button class="rating-btn ${selectedAttention.thought_attention===n?'selected':''}" data-rating="thought_attention" data-value="${n}" aria-pressed="${selectedAttention.thought_attention===n}">${n}</button>`).join('')}</div><div class="rating-caption"><span>1 · Needs attention</span><span>5 · Excellent</span></div></div><div class="rating-group"><h2>Attention on Time</h2><div class="rating-scale">${[1,2,3,4,5].map(n=>`<button class="rating-btn ${selectedAttention.time_attention===n?'selected':''}" data-rating="time_attention" data-value="${n}" aria-pressed="${selectedAttention.time_attention===n}">${n}</button>`).join('')}</div><div class="rating-caption"><span>1 · Needs attention</span><span>5 · Excellent</span></div></div><div class="actions" style="margin-top:22px"><button id="cancelCheckin">Cancel</button><button class="primary" id="saveCheckin" style="flex:1">${bulkCheckin?`Save for ${selectedHours.size?Array.from(selectedHours).sort((a,b)=>a-b).map(LABEL).join(', '):'selected hours'}${selectedHours.size?` (${selectedHours.size} hour${selectedHours.size===1?'':'s'})`:''}`:(existingAtHour(selectedHour)?'Update Check-in':'Save Check-in')}</button></div><p id="saveError" class="error"></p></div>`;
 page.querySelector('#backToday').onclick=renderToday;
 page.querySelector('#cancelCheckin').onclick=renderToday;
 page.querySelectorAll('[data-hour-toggle]').forEach(b=>b.onclick=()=>{const h=Number(b.dataset.hourToggle);if(selectedHours.has(h))selectedHours.delete(h);else selectedHours.add(h);drawCheckin()});
 page.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{selectedState=String(b.dataset.state);drawCheckin()});
 page.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>{selectedAttention[b.dataset.rating]=Number(b.dataset.value);drawCheckin()});
 page.querySelector('#saveCheckin').onclick=saveCheckin;
}
async function saveCheckin(){
 const button=document.getElementById('saveCheckin'),error=document.getElementById('saveError');
 if(!selectedAttention.thought_attention||!selectedAttention.time_attention){error.textContent='Please select a score from 1 to 5 for both attention ratings.';return}
 const hoursToSave=bulkCheckin?Array.from(selectedHours).sort((a,b)=>a-b):[selectedHour];
 if(!hoursToSave.length){error.textContent='Please select at least one unfilled hour.';return}
 button.disabled=true;button.textContent='Saving…';error.textContent='';
 try{
   for(const hour of hoursToSave){
     // Never overwrite a saved check-in during bulk fill.
     if(bulkCheckin&&(dayData?.checkins||[]).some(c=>c.hour===hour))continue;
     const r=await api(`/api/day/${date}/hour/${hour}`,{method:'PUT',body:JSON.stringify({mind_state:selectedState,...selectedAttention})});
     if(!r.ok){const x=await r.json();throw new Error(x.error||`Could not save ${LABEL(hour)} check-in`)}
   }
   const savedLabels=hoursToSave.map(LABEL);
   bulkCheckin=false;
   await renderToday();
   document.getElementById('notice').textContent=`Saved check-in for ${savedLabels.join(', ')}.`;
   window.scrollTo({top:0,behavior:'smooth'});
 }catch(e){error.textContent=e.message;button.disabled=false;button.textContent=bulkCheckin?`Save selected hours (${hoursToSave.length})`:'Update Check-in'}
}
async function renderSettings(){
 showPage('settingsPage','settingsTab');
 const page=document.getElementById('settingsPage');
 page.innerHTML=`<div class="card"><h2>Daily Goals</h2><p class="muted">Active goals appear each day.</p><div id="goalSettings"></div><div class="actions"><input id="newGoal" type="text" placeholder="New goal name"><button class="primary" id="addGoal">Add</button></div><p id="goalMessage" class="muted"></p></div>
 <div class="card"><h2>Account</h2><p class="muted">Username cannot be changed.</p><label>Username<input type="text" value="${escapeHTML(currentUser.username)}" disabled readonly style="margin-top:8px"></label><input id="currentPassword" type="password" placeholder="Current password" style="margin-top:8px"><input id="newPassword" type="password" placeholder="New password (12+ characters)" style="margin-top:8px"><button class="primary" id="updateAccount" style="margin-top:10px">Update Password</button><p id="accountMessage" class="muted"></p></div>
 ${currentUser.role==='admin'?`<div class="card" id="adminUsersCard"><h2>Manage Users</h2><p class="muted">Create accounts and activate or deactivate access. Users can only see their own tracker data.</p><label>Username<input id="newUsername" type="text" placeholder="e.g. user01" autocomplete="off"></label><label>Temporary password (12+ characters)<input id="newUserPassword" type="password" placeholder="Set a temporary password" autocomplete="new-password"></label><button class="primary" id="createUser" style="margin-top:8px">Create User</button><p id="adminMessage" class="muted"></p><div id="userList"></div></div>`:''}
 <div class="card"><button id="signOut">Sign Out</button></div>`;
 const r=await api('/api/settings/goals');if(!r.ok)return;
 const goals=await r.json(),box=page.querySelector('#goalSettings');box.innerHTML='';
 goals.forEach(g=>{const row=document.createElement('div');row.className='setting';row.innerHTML='<input type="text" value="'+escapeHTML(g.goal_name)+'"><button>Save</button><button>Delete</button>';row.children[1].onclick=async()=>{const res=await api('/api/settings/goals/'+g.id,{method:'PUT',body:JSON.stringify({goal_name:row.querySelector('input[type=text]').value,active:true})});page.querySelector('#goalMessage').textContent=res.ok?'Goal updated.':'Could not update goal.';renderSettings()};row.children[2].onclick=async()=>{if(confirm('Delete this goal?')){await api('/api/settings/goals/'+g.id,{method:'DELETE'});renderSettings()}};box.append(row)});
 page.querySelector('#addGoal').onclick=async()=>{const input=page.querySelector('#newGoal'),msg=page.querySelector('#goalMessage');const res=await api('/api/settings/goals',{method:'POST',body:JSON.stringify({goal_name:input.value})});if(res.ok)renderSettings();else msg.textContent=(await res.json()).error||'Could not add goal.'};
 if(currentUser.role==='admin'){
  const loadUsers=async()=>{const res=await api('/api/admin/users');if(!res.ok)return;const users=await res.json(),list=page.querySelector('#userList');list.innerHTML='';users.forEach(u=>{if(u.role==='admin')return;const row=document.createElement('div');row.className='setting';row.innerHTML='<div style="flex:1;min-width:0"><strong>'+escapeHTML(u.username)+'</strong><div class="muted">'+(u.active?'Active':'Inactive')+'</div></div><button>'+(u.active?'Deactivate':'Activate')+'</button>';row.querySelector('button').onclick=async()=>{const rr=await api('/api/admin/users/'+u.id,{method:'PUT',body:JSON.stringify({active:!u.active})});if(rr.ok)loadUsers();else page.querySelector('#adminMessage').textContent=(await rr.json()).error||'Could not update user.'};list.append(row)})};
  page.querySelector('#createUser').onclick=async()=>{const msg=page.querySelector('#adminMessage'),username=page.querySelector('#newUsername').value,password=page.querySelector('#newUserPassword').value;const res=await api('/api/admin/users',{method:'POST',body:JSON.stringify({username,password})});const data=await res.json();if(!res.ok){msg.textContent=data.error||'Could not create user.';return}msg.textContent='Account created. Share credentials securely with the user.';page.querySelector('#newUsername').value='';page.querySelector('#newUserPassword').value='';loadUsers()};loadUsers()
 }
 page.querySelector('#updateAccount').onclick=async()=>{const msg=page.querySelector('#accountMessage'),currentInput=page.querySelector('#currentPassword'),newInput=page.querySelector('#newPassword'),button=page.querySelector('#updateAccount'),currentPassword=currentInput.value,newPassword=newInput.value;if(!currentPassword||!newPassword){msg.textContent='Enter your current password and a new password.';return}if(newPassword.length<12){msg.textContent='New password must be at least 12 characters long.';return}button.disabled=true;button.textContent='Updating…';msg.textContent='';try{const res=await api('/api/settings/account',{method:'PUT',body:JSON.stringify({currentPassword,newPassword})}),out=await res.json();if(!res.ok)throw new Error(out.error||'Could not update password.');token='';localStorage.removeItem('mindToken');login();const success=document.createElement('p');success.className='success';success.textContent='Password updated. Sign in with your new password.';app.querySelector('.login').append(success)}catch(e){msg.textContent=e.message;button.disabled=false;button.textContent='Update Password'}};
 page.querySelector('#signOut').onclick=()=>{token='';localStorage.removeItem('mindToken');login()}
}
if(token){api('/api/me').then(async r=>{if(!r.ok){login();return}currentUser=await r.json();renderToday()}).catch(()=>login())}else login();
</script></main></body></html>
